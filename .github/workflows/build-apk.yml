name: Build OpenWrt APK

on:
  push:
    branches:
      - compat/luci-25.12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Download and verify OpenWrt 25.12 SDK
        run: |
          set -euo pipefail
          SDK_FILE='openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          curl -fL --retry 3 -o sdk.tar.zst "https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/$SDK_FILE"
          echo '9f371906ce6d2f95418f69fac06df58bf9df0ffc4abed6206c30f1b547fcfc12  sdk.tar.zst' | sha256sum -c -
          mkdir openwrt-sdk
          tar --zstd -xf sdk.tar.zst -C openwrt-sdk --strip-components=1

      - name: Install theme feed
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf package/feeds/luci/luci-theme-opentopd
          mkdir -p package/luci-theme-opentopd
          cp -a "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" package/luci-theme-opentopd/

      - name: Build package
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail
          echo 'CONFIG_PACKAGE_luci-theme-opentopd=m' >> .config
          make defconfig
          make package/luci-theme-opentopd/compile V=s -j2

      - name: Collect APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          find openwrt-sdk/bin -type f -name 'luci-theme-opentopd*.apk' -print -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-opentopd-openwrt-25.12
          path: dist/*
          if-no-files-found: error
