name: Build OpenWrt IPK
on:
  push:
    branches: [compat/luci-25.12]
    paths:
      - '.github/workflows/build-ipk.yml'
      - 'Makefile'
      - 'htdocs/**'
      - 'root/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file curl zstd
      - name: Download and verify SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipk-sdk"
          cd "$RUNNER_TEMP/ipk-sdk"
          BASE=https://downloads.openwrt.org/releases/24.10.5/targets/x86/64
          curl -fL --retry 3 "$BASE/sha256sums" -o sha256sums
          SDK=$(awk '{print $2}' sha256sums | sed 's/^\*//' | grep -E '^openwrt-sdk-24\.10\.5-x86-64_.*\.tar\.(xz|zst)$')
          test "$(printf '%s\n' "$SDK" | wc -l)" -eq 1
          test -n "$SDK"
          curl -fL --retry 3 "$BASE/$SDK" -o "$SDK"
          grep -F "$SDK" sha256sums | sha256sum -c -
          mkdir sdk
          tar -xf "$SDK" -C sdk --strip-components=1
      - name: Prepare and build theme
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ipk-sdk/sdk"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf package/feeds/luci/luci-theme-opentopd
          mkdir -p package/luci-theme-opentopd
          cp -a "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" package/luci-theme-opentopd/
          echo 'CONFIG_PACKAGE_luci-theme-opentopd=m' >> .config
          make defconfig
          make package/luci-theme-opentopd/compile V=s -j2
      - name: Collect and inspect IPK
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$RUNNER_TEMP/ipk-sdk/sdk/bin" -type f -name 'luci-theme-opentopd*.ipk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.ipk' -print -quit)"
          for pkg in dist/*.ipk; do
            work=$(mktemp -d)
            if ar t "$pkg" >/dev/null 2>&1; then
              (cd "$work" && ar x "$GITHUB_WORKSPACE/$pkg")
            else
              tar -xf "$pkg" -C "$work"
            fi
            tar -tf "$work"/data.tar.* > "$pkg.contents.txt"
            grep -F 'usr/share/ucode/luci/template/themes/opentopd/header.ut' "$pkg.contents.txt"
            grep -F 'usr/share/ucode/luci/template/themes/opentopd/footer.ut' "$pkg.contents.txt"
            grep -F 'www/luci-static/opentopd/css/style.css' "$pkg.contents.txt"
            grep -F 'www/luci-static/opentopd/css/compat.css' "$pkg.contents.txt"
            grep -F 'etc/uci-defaults/' "$pkg.contents.txt"
            tar -xOf "$work"/control.tar.* ./control > "$pkg.control.txt"
            rm -rf "$work"
          done
          sha256sum dist/*.ipk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-opentopd-ipk
          path: dist/*
          if-no-files-found: error
