name: LuCI 25.12 compatibility
on:
  push:
    branches: [luci-25.12]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check htdocs/luci-static/opentopd/js/script.js
          node --check htdocs/luci-static/resources/menu-opentopd.js
          node tests/menu.test.cjs
          sh -n root/etc/uci-defaults/30_luci-theme-opentopd
          git diff --check
      - name: Build the ucode compiler and compile templates
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev
          git clone --depth 1 https://github.com/jow-/ucode.git /tmp/ucode
          git -C /tmp/ucode rev-parse HEAD
          cmake -S /tmp/ucode -B /tmp/ucode/build -DFS_SUPPORT=ON
          cmake --build /tmp/ucode/build -j2
          /tmp/ucode/build/ucode -L '/tmp/ucode/build/*.so' -L "$GITHUB_WORKSPACE/tests/mocks/*.uc" tests/compile-templates.uc ucode/template/themes/opentopd/*.ut
          /tmp/ucode/build/ucode -L '/tmp/ucode/build/*.so' -L "$GITHUB_WORKSPACE/tests/mocks/*.uc" tests/render-templates.uc
  lede-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: theme
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget fakeroot libdeflate-tools zstd
      - name: Prepare LEDE and the requested LuCI branch
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede
          cd lede
          printf '%s\n' 'src-git luci https://github.com/coolsnowwolf/luci.git;openwrt-25.12' > feeds.conf
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci
          cp -a ../theme package/luci-theme-opentopd
          printf '%s\n' 'CONFIG_TARGET_x86=y' 'CONFIG_TARGET_x86_64=y' 'CONFIG_TARGET_x86_64_DEVICE_generic=y' 'CONFIG_PACKAGE_luci-theme-opentopd=m' '# CONFIG_LUCI_JSMIN is not set' '# CONFIG_LUCI_CSSTIDY is not set' > .config
          make defconfig
          git rev-parse HEAD
          git -C feeds/luci rev-parse HEAD
          grep '^CONFIG_PACKAGE_luci-theme-opentopd=m' .config
      - name: Build architecture-independent package with distro host tools
        working-directory: lede
        run: |
          # A package-only smoke build: dependencies are declared but not rebuilt.
          # This does not validate a complete firmware or its target libraries.
          mkdir -p staging_dir/host/bin
          for tool in bash tar sed patch libdeflate-gzip zstd; do
            ln -sf "$(command -v "$tool")" "staging_dir/host/bin/$tool"
          done
          make package/luci-theme-opentopd/compile NO_DEPS=1 FAKEROOT=fakeroot -j2 V=s
          find bin -name 'luci-theme-opentopd*.ipk' -print | tee /tmp/theme-packages
          test -s /tmp/theme-packages
      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-opentopd
          path: lede/bin/packages/**/luci-theme-opentopd*.ipk
          if-no-files-found: error
